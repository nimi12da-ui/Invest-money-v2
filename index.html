<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 투자 성향 테스트</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="hero-section">
            <h1>숨어있는 내 투자 본능 찾기</h1>
            <p>나는 투자 세계에서 어떤 동물과 닮았을까요?</p>
        </header>

        <main>
            <form id="quiz-form" class="quiz-card">
                
                <!-- 질문 1 -->
                <div class="question">
                    <p class="question-title">1. 친구가 주식으로 대박 났다는 소식을 들었을 때 나는?</p>
                    <input type="radio" name="q1" value="5" id="q1-a">
                    <label for="q1-a">"대단하다! 나라면 무서워서 못했을 텐데..."</label>
                    <input type="radio" name="q1" value="10" id="q1-b">
                    <label for="q1-b">"오, 좋은데? 어떤 종목인지 물어봐야지."</label>
                    <input type="radio" name="q1" value="20" id="q1-c">
                    <label for="q1-c">"나도 질 수 없지! 바로 주식 계좌를 확인한다."</label>
                </div>

                <!-- 질문 2 -->
                <div class="question">
                    <p class="question-title">2. 월급날, 내 통장 잔고는 보통...?</p>
                    <input type="radio" name="q2" value="20" id="q2-a">
                    <label for="q2-a">"항상 텅 비어있다. 다음 월급날만 기다린다."</label>
                    <input type="radio" name="q2" value="10" id="q2-b">
                    <label for="q2-b">"계획적으로 소비하고, 일부는 저축한다."</label>
                    <input type="radio" name="q2" value="5" id="q2-c">
                    <label for="q2-c">"월급의 절반 이상은 무조건 저축! 또는 투자!"</label>
                </div>

                <!-- 질문 3 -->
                <div class="question">
                    <p class="question-title">3. 길을 가다 10만 원을 주웠다! 나는...</p>
                    <input type="radio" name="q3" value="20" id="q3-a">
                    <label for="q3-a">"와, 횡재다! 바로 맛있는 거 사 먹는다."</label>
                    <input type="radio" name="q3" value="10" id="q3-b">
                    <label for="q3-b">"일단 주머니에 넣고, 뭘 할지 고민한다."</label>
                    <input type="radio" name="q3" value="5" id="q3-c">
                    <label for="q3-c">"혹시 모르니 일단 비상금 통장에 넣어둔다."</label>
                </div>

                <!-- 질문 4 -->
                <div class="question">
                    <p class="question-title">4. 쇼핑할 때 나의 스타일은?</p>
                    <input type="radio" name="q4" value="20" id="q4-a">
                    <label for="q4-a">"꽂히면 바로 산다! 고민은 배송만 늦출 뿐."</label>
                    <input type="radio" name="q4" value="10" id="q4-b">
                    <label for="q4-b">"장바구니에 넣어두고 며칠 동안 고민한다."</label>
                    <input type="radio" name="q4" value="5" id="q4-c">
                    <label for="q4-c">"가격 비교는 기본, 할인 쿠폰까지 꼼꼼히 챙긴다."</label>
                </div>

                <!-- 질문 5 -->
                <div class="question">
                    <p class="question-title">5. 10년 뒤 나의 모습은...?</p>
                    <input type="radio" name="q5" value="20" id="q5-a">
                    <label for="q5-a">"경제적 자유를 이룬 파이어족!"</label>
                    <input type="radio" name="q5" value="10" id="q5-b">
                    <label for="q5-b">"지금보다 여유롭고 안정적인 삶을 살고 있을 것 같다."</label>
                    <input type="radio" name="q5" value="5" id="q5-c">
                    <label for="q5-c">"큰 부자는 아니더라도, 걱정 없이 살고 있으면 좋겠다."</label>
                </div>

                <button type="submit" class="submit-btn">결과 확인하기</button>
            </form>

            <section id="result-section" class="result-card" style="display: none;">
                <div id="result-content">
                    <!-- 분석 결과가 여기에 동적으로 삽입됩니다. -->
                </div>
            </section>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
